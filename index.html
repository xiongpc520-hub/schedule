<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MySchedule">
  <title>xbeeear · 节奏与时间骨架</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ☀️ 浅色模式（自然呼吸 · 极简灰白与厦马深蓝） */
    [data-theme="light"] {
      --bg-canvas: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.88);
      --bg-card-hover: #ffffff;
      --bg-surface: #ffffff;
      --border-subtle: rgba(226, 232, 240, 0.8);
      --border-focus: #3b82f6;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-primary: #1e3a8a;
      --accent-glow: rgba(30, 58, 138, 0.12);
      --accent-active: #2563eb;
      --tag-bg: #f1f5f9;
      --tag-text: #334155;
      --pulse-color: #2563eb;
      --shadow-soft: 0 10px 30px -10px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
      --shadow-active: 0 16px 36px -12px rgba(37, 99, 235, 0.18);
    }

    /* 🌙 深色模式（OLED 深度灰黑与极光蓝霓虹微光） */
    [data-theme="dark"] {
      --bg-canvas: #090d16;
      --bg-card: rgba(17, 24, 39, 0.72);
      --bg-card-hover: rgba(26, 36, 56, 0.85);
      --bg-surface: #111827;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #60a5fa;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --accent-active: #0284c7;
      --tag-bg: rgba(255, 255, 255, 0.06);
      --tag-text: #cbd5e1;
      --pulse-color: #38bdf8;
      --shadow-soft: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
      --shadow-active: 0 16px 40px -10px rgba(56, 189, 248, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.5s ease, color 0.5s ease;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    /* 顶部流体呼吸光斑 */
    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
      transition: var(--transition-smooth);
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 20px 0;
      position: relative;
      z-index: 1;
    }

    /* 顶栏控制 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span.dot {
      width: 8px;
      height: 8px;
      background: var(--pulse-color);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 12px var(--pulse-color);
      animation: pulse-dot 2.5s infinite;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-soft);
      transition: var(--transition-smooth);
    }

    .theme-toggle:active {
      transform: scale(0.92);
    }

    /* 实时脉冲当前卡片 */
    .live-status-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .live-status-card:active {
      transform: scale(0.99);
    }

    .live-status-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, var(--pulse-color), var(--accent-active));
    }

    .live-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--pulse-color);
    }

    .live-clock {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }

    .live-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .live-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .live-progress-container {
      margin-top: 14px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
    }

    [data-theme="dark"] .live-progress-container {
      background: rgba(255, 255, 255, 0.08);
    }

    .live-progress-bar {
      height: 100%;
      background: var(--pulse-color);
      border-radius: 99px;
      transition: width 1s linear;
    }

    /* 星期滑动切换胶囊 */
    .day-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 18px;
      margin-bottom: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .day-selector::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 calc((100% - 36px) / 7);
      min-width: 44px;
      height: 56px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: var(--transition-smooth);
      position: relative;
    }

    .day-chip span.day-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .day-chip span.day-tag {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    .today-dot {
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .day-chip.active {
      background: var(--accent-primary);
      border-color: transparent;
      color: #ffffff !important;
      box-shadow: 0 8px 20px -4px var(--accent-primary);
      transform: translateY(-2px);
    }

    .day-chip.active .today-dot {
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }

    .day-chip.active span.day-name,
    .day-chip.active span.day-tag {
      color: #ffffff;
    }

    /* 核心时间流卡片列表 */
    .timeline-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 16px 0 12px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .time-slot {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      gap: 16px;
      transition: var(--transition-smooth);
      position: relative;
    }

    .time-slot:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .time-slot.is-active {
      border: 1.5px solid var(--pulse-color);
      box-shadow: var(--shadow-active);
      background: var(--bg-card-hover);
    }

    .time-slot.is-active::after {
      content: 'NOW';
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: var(--pulse-color);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .slot-time-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 78px;
    }

    .slot-start {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .slot-end {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .slot-content-col {
      flex: 1;
    }

    .slot-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .slot-details {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .slot-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .slot-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-weight: 600;
    }

    .slot-tag.highlight {
      background: var(--accent-glow);
      color: var(--pulse-color);
    }

    .slot-badge-link {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent-glow);
      color: var(--pulse-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: 8px;
      vertical-align: middle;
      transition: var(--transition-smooth);
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .slot-badge-link:active {
      transform: scale(0.92);
    }

    /* 可插拔卡片抽屉 (Bottom Drawer / Cards Section) */
    .task-cards-section {
      margin-top: 36px;
    }

    .cards-tab-header {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-right: 28px;
      padding-bottom: 4px;
    }

    .cards-tab-header::-webkit-scrollbar {
      display: none;
    }

    .card-tab-btn {
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-smooth);
    }

    .card-tab-btn.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: transparent;
    }

    .card-deck {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .strategy-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3.5px solid var(--pulse-color);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 2px;
    }

    .strategy-banner .strategy-icon {
      font-size: 14px;
      line-height: 1.2;
    }

    .interactive-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }

    .interactive-card:active {
      transform: scale(0.985);
    }

    .interactive-card.done {
      opacity: 0.6;
    }

    .card-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--border-subtle);
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }

    .interactive-card.done .card-checkbox {
      background: #10b981;
      border-color: #10b981;
    }

    .interactive-card.done .card-checkbox::after {
      content: '✓';
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
    }

    .card-content-col {
      flex: 1;
      min-width: 0;
    }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .card-cat-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.12);
      color: #2563eb;
      letter-spacing: 0.5px;
    }
    [data-theme="dark"] .card-cat-pill {
      background: rgba(96, 165, 250, 0.18);
      color: #93c5fd;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .interactive-card.done .card-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .card-time-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--tag-bg);
      color: var(--tag-text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .card-badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-note-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    [data-theme="dark"] .card-note-badge {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .card-focus-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    [data-theme="dark"] .card-focus-badge {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* 营养速查胶囊 */
    .nutrition-bar {
      margin-top: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .nutrition-item {
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      transition: var(--transition-smooth);
      user-select: none;
      border: 1px solid transparent;
    }

    .nutrition-item:active {
      transform: scale(0.93);
    }

    .nutrition-item.checked {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .nutrition-item h5 {
      font-size: 16px;
      font-weight: 800;
      color: var(--pulse-color);
      transition: color 0.3s ease;
    }

    .nutrition-item.checked h5 {
      color: #10b981;
    }

    .nutrition-item p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
      transition: color 0.3s ease;
    }

    .nutrition-item.checked p {
      color: #10b981;
    }

    .nutri-check {
      font-size: 11px;
      font-weight: 900;
      margin-left: 2px;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="ambient-glow"></div>

  <div class="container">
    <!-- 顶栏 -->
    <header>
      <div class="brand">
        <div class="brand-title">
          <span>xbeeear</span>
          <span class="dot"></span>
        </div>
        <div class="brand-sub">XMUM 数据科学 · 大二秋季学期</div>
      </div>
      <div class="controls">
        <button class="theme-toggle" id="themeBtn" title="切换深浅主题">☀️</button>
      </div>
    </header>

    <!-- 实时状态浮窗 -->
    <div class="live-status-card" id="liveCard">
      <div class="live-header">
        <span class="live-badge" id="liveBadge">
          <span style="width:6px; height:6px; background:currentColor; border-radius:50%; display:inline-block;"></span>
          LIVE 阶段
        </span>
        <span class="live-clock" id="liveClock">21:38:00</span>
      </div>
      <div class="live-title" id="liveTitle">加载当前日程中...</div>
      <div class="live-desc" id="liveDesc">系统正在对齐物理时间骨架</div>
      <div class="live-progress-container">
        <div class="live-progress-bar" id="liveProgressBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- 星期切换胶囊 -->
    <div class="day-selector" id="daySelector">
      <div class="day-chip" data-day="1"><span class="day-name">周一</span><span class="day-tag">3课</span></div>
      <div class="day-chip" data-day="2"><span class="day-name">周二</span><span class="day-tag">推</span></div>
      <div class="day-chip" data-day="3"><span class="day-name">周三</span><span class="day-tag">AI</span></div>
      <div class="day-chip" data-day="4"><span class="day-name">周四</span><span class="day-tag">晚课</span></div>
      <div class="day-chip" data-day="5"><span class="day-name">周五</span><span class="day-tag">⚽</span></div>
      <div class="day-chip" data-day="6"><span class="day-name">周六</span><span class="day-tag">拉</span></div>
      <div class="day-chip" data-day="0"><span class="day-name">周日</span><span class="day-tag">腿肩</span></div>
    </div>

    <!-- 动态时间轴 -->
    <div class="timeline-title">
      <span id="currentDayLabel">今日时间骨架</span>
      <span id="timelineCountLabel" style="font-size:12px; color:var(--text-muted); font-weight:500;">今日节律</span>
    </div>

    <div class="timeline-list" id="timelineList">
      <!-- 动态注入当前选中的日程时间块 -->
    </div>

    <!-- 营养与能量追踪 (可点击微打卡) -->
    <div class="nutrition-bar" id="nutritionBar">
      <div class="nutrition-item" id="nutri_protein" onclick="toggleNutrition('protein')" title="点击记录蛋白质摄入">
        <h5>125g<span class="nutri-check"></span></h5>
        <p>纯蛋白质</p>
      </div>
      <div style="width:1px; height:24px; background:var(--border-subtle);"></div>
      <div class="nutrition-item" id="nutri_creatine" onclick="toggleNutrition('creatine')" title="点击记录肌酸摄入">
        <h5>5g<span class="nutri-check"></span></h5>
        <p>一水肌酸</p>

    // ══════════════════════════════════════════════════════════════
    // 2. 主题引擎（自动根据时间切换深浅 + 手动覆盖）
    // ══════════════════════════════════════════════════════════════
    const themeBtn = document.getElementById("themeBtn");
    
    function initTheme() {
      const savedTheme = localStorage.getItem("xbeeear_theme");
      if (savedTheme) {
        setTheme(savedTheme);
      } else {
        // 自动按自然时间判断：06:30 到 18:30 为浅色，其余为深色
        const now = new Date();
        const hour = now.getHours();
        const autoTheme = (hour >= 6 && hour < 18) ? "light" : "dark";
        setTheme(autoTheme);
      }
    }

    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      themeBtn.textContent = theme === "dark" ? "🌙" : "☀️";
      localStorage.setItem("xbeeear_theme", theme);
    }

    themeBtn.addEventListener("click", () => {
      const current = document.body.getAttribute("data-theme");
      setTheme(current === "dark" ? "light" : "dark");
    });

    // ══════════════════════════════════════════════════════════════
    // 3. 动态时间轴渲染与实时脉冲
    // ══════════════════════════════════════════════════════════════
    let selectedDay = new Date().getDay(); // 默认今天
    const timelineList = document.getElementById("timelineList");
    const daySelector = document.getElementById("daySelector");
    const currentDayLabel = document.getElementById("currentDayLabel");

    function renderDaySelector() {
      const realToday = new Date().getDay();
      const chips = daySelector.querySelectorAll(".day-chip");
      chips.forEach(chip => {
        const d = parseInt(chip.getAttribute("data-day"));
        chip.classList.toggle("active", d === selectedDay);

        let dot = chip.querySelector(".today-dot");
        if (d === realToday) {
          if (!dot) {
            dot = document.createElement("span");
            dot.className = "today-dot";
            dot.title = "现实中的今天";
            chip.appendChild(dot);
          }
        } else if (dot) {
          dot.remove();
        }

        chip.onclick = () => {
          selectedDay = d;
          renderDaySelector();
          renderTimeline();
        };
      });
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      return h * 60 + m;
    }

    function jumpToCardTab(tab) {
      activeCardTab = tab;
      renderCards();
      const target = document.getElementById("cardDeck");
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function renderTimeline() {
      const dayNames = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      currentDayLabel.textContent = `${dayNames[selectedDay]} · 详细时间骨架`;
      
      const slots = SCHEDULE_DATA[selectedDay] || [];
      const timelineCountLabel = document.getElementById("timelineCountLabel");
      if (timelineCountLabel) {
        timelineCountLabel.textContent = `今日 ${slots.length} 项日程 · 错峰律动`;
      }

      const now = new Date();
      const currentDay = now.getDay();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let html = "";
      slots.forEach((slot, idx) => {
        const startMin = timeToMinutes(slot.start);
        const endMin = timeToMinutes(slot.end);
        
        let isActive = false;
        // 跨天判断 (如 23:30 到 07:30)
        if (selectedDay === currentDay) {
          if (startMin > endMin) {
            isActive = currentMinutes >= startMin || currentMinutes < endMin;
          } else {
            isActive = currentMinutes >= startMin && currentMinutes < endMin;
          }
        }

        const tagsHtml = (slot.tags || []).map(t => 
          `<span class="slot-tag ${t.includes('命脉') || t.includes('训练') || t.includes('足球') ? 'highlight' : ''}">${t}</span>`
        ).join("");

        const slotBadgeHtml = slot.cardTab ? `
          <span class="slot-badge-link" onclick="jumpToCardTab('${slot.cardTab}')" title="点击直达对应任务卡">
            📌 插槽: ${slot.cardTab} 卡 ➔
          </span>
        ` : '';

        html += `
          <div class="time-slot ${isActive ? 'is-active' : ''}">
            <div class="slot-time-col">
              <span class="slot-start">${slot.start}</span>
              <span class="slot-end">${slot.end}</span>
            </div>
            <div class="slot-content-col">
              <div class="slot-title">${slot.title} ${slotBadgeHtml}</div>
              <div class="slot-details">${slot.desc}</div>
              <div class="slot-tags">${tagsHtml}</div>
            </div>
          </div>
        `;
      });

      timelineList.innerHTML = html;
    }

    // ══════════════════════════════════════════════════════════════
    // 4. 实时时钟与当前进行状态检测
    // ══════════════════════════════════════════════════════════════
    function updateLiveEngine() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("liveClock").textContent = `${h}:${m}:${s}`;

      const today = now.getDay();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const slots = SCHEDULE_DATA[today] || [];

      let activeSlot = null;
      let progressPercent = 0;
      let remainingMin = 0;

      for (let slot of slots) {
        const sMin = timeToMinutes(slot.start);
        const eMin = timeToMinutes(slot.end);
        let inRange = false;
        let totalDuration = 0;
        let elapsed = 0;

        if (sMin > eMin) { // 跨天
          inRange = currentMin >= sMin || currentMin < eMin;
          totalDuration = (1440 - sMin) + eMin;
          elapsed = currentMin >= sMin ? (currentMin - sMin) : ((1440 - sMin) + currentMin);
        } else {
          inRange = currentMin >= sMin && currentMin < eMin;
          totalDuration = eMin - sMin;
          elapsed = currentMin - sMin;
        }

        if (inRange) {
          activeSlot = slot;
          progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
          remainingMin = totalDuration - elapsed;
          break;
        }
      }

      const liveTitle = document.getElementById("liveTitle");
      const liveDesc = document.getElementById("liveDesc");
      const liveProgressBar = document.getElementById("liveProgressBar");
      const liveBadge = document.getElementById("liveBadge");

      if (activeSlot) {
        liveTitle.textContent = activeSlot.title;
        liveDesc.textContent = `${activeSlot.desc} · 预计还剩 ${remainingMin} 分钟`;
        liveProgressBar.style.width = `${progressPercent}%`;
        liveBadge.innerHTML = `<span style="width:6px; height:6px; background:currentColor; border-radius:50%; display:inline-block;"></span> 正在进行中`;
      } else {
        liveTitle.textContent = "自由律动时间";
        liveDesc.textContent = "当前未处于严苛排期中，自主掌控呼吸节奏";
        liveProgressBar.style.width = "0%";
      }
    }

    // ══════════════════════════════════════════════════════════════
    // 5. 可插拔卡片打卡抽屉 (LocalStorage 持久化)
    // ══════════════════════════════════════════════════════════════
    let activeCardTab = "A";

    function getDoneCards() {
      try {
        return JSON.parse(localStorage.getItem("xbeeear_done_cards") || "{}");
      } catch {
        return {};
      }
    }

    function toggleCardDone(cardId) {
      const doneMap = getDoneCards();
      doneMap[cardId] = !doneMap[cardId];
      localStorage.setItem("xbeeear_done_cards", JSON.stringify(doneMap));
      renderCards();
    }

    function resetDoneCards() {
      if (confirm("确定重置今天的打卡勾选吗？")) {
        localStorage.removeItem("xbeeear_done_cards");
        renderCards();
      }
    }

    function renderCards() {
      const deck = document.getElementById("cardDeck");
      const tabData = CARD_LIBRARY[activeCardTab] || { tip: "", cards: [] };
      const cards = tabData.cards || [];
      const doneMap = getDoneCards();

      let html = "";
      if (tabData.tip) {
        html += `
          <div class="strategy-banner">
            <span class="strategy-icon">💡</span>
            <div class="strategy-text">${tabData.tip}</div>
          </div>
        `;
      }

      html += cards.map(c => {
        const isDone = !!doneMap[c.id];
        return `
          <div class="interactive-card ${isDone ? 'done' : ''}" onclick="toggleCardDone('${c.id}')">
            <div class="card-checkbox"></div>
            <div class="card-content-col">
              <div class="card-header-row">
                <div class="card-title-group">
                  <span class="card-cat-pill">${c.cat}</span>
                  <span class="card-title">${c.title}</span>
                </div>
                <span class="card-time-pill">${c.time}</span>
              </div>
              <div class="card-badges-row">
                <span class="card-note-badge">${c.noteBadge}</span>
                ${c.focusBadge ? `<span class="card-focus-badge">${c.focusBadge}</span>` : ''}
              </div>
              <div class="card-desc">${c.desc}</div>
            </div>
          </div>
        `;
      }).join("");

      deck.innerHTML = html;

      document.querySelectorAll(".card-tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === activeCardTab);
      });
    }

    document.querySelectorAll(".card-tab-btn").forEach(btn => {
      btn.onclick = () => {
        activeCardTab = btn.getAttribute("data-tab");
        renderCards();
      };
    });

    // ══════════════════════════════════════════════════════════════
    // 6. 身体能量与营养微交互打卡 (每日自动重置)
    // ══════════════════════════════════════════════════════════════
    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
    }

    function getNutritionState() {
      try {
        const saved = JSON.parse(localStorage.getItem("xbeeear_nutrition_state") || "{}");
        if (saved && saved.date === getTodayKey()) return saved.items || {};
        return {}; // 跨天自动重置
      } catch {
        return {};
      }
    }

    function toggleNutrition(key) {
      const state = getNutritionState();
      state[key] = !state[key];
      localStorage.setItem("xbeeear_nutrition_state", JSON.stringify({
        date: getTodayKey(),
        items: state
      }));
      renderNutrition();
    }

    function renderNutrition() {
      const state = getNutritionState();
      ['protein', 'creatine', 'water', 'sleep'].forEach(key => {
        const el = document.getElementById(`nutri_${key}`);
        if (el) {
          const isChecked = !!state[key];
          el.classList.toggle("checked", isChecked);
          const checkSpan = el.querySelector(".nutri-check");
          if (checkSpan) {
            checkSpan.textContent = isChecked ? " ✓" : "";
          }
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    // 7. 系统自适应启动与交互挂载
    // ══════════════════════════════════════════════════════════════
    window.addEventListener("DOMContentLoaded", () => {
      initTheme();
      renderDaySelector();
      renderTimeline();
      renderCards();
      renderNutrition();
      updateLiveEngine();
      setInterval(updateLiveEngine, 1000); // 1秒心跳

      // 点击 Live 浮窗平滑直达当前日程节点
      const liveCardEl = document.getElementById("liveCard");
      if (liveCardEl) {
        liveCardEl.onclick = () => {
          const today = new Date().getDay();
          if (selectedDay !== today) {
            selectedDay = today;
            renderDaySelector();
            renderTimeline();
          }
          setTimeout(() => {
            const activeEl = document.querySelector(".time-slot.is-active");
            if (activeEl) {
              activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
              activeEl.style.boxShadow = "0 0 24px rgba(37, 99, 235, 0.4)";
              setTimeout(() => { activeEl.style.boxShadow = ""; }, 1400);
            }
          }, 120);
        };
      }
    });
  </script>
